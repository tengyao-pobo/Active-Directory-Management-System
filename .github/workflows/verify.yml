name: Verify console
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/Agent/Agent.Tests.csproj --locked-mode
      - run: dotnet test tests/Agent/Agent.Tests.csproj -c Release --no-restore --logger trx
      - run: dotnet restore tests/AgentHost/AgentHost.Tests.csproj --locked-mode
      - run: dotnet test tests/AgentHost/AgentHost.Tests.csproj -c Release --no-restore --logger trx
      - run: dotnet restore tests/AgentEnrollment/AgentEnrollment.Tests.csproj --locked-mode
      - run: dotnet test tests/AgentEnrollment/AgentEnrollment.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~CsrValidationTests|FullyQualifiedName~CertificateValidationTests|FullyQualifiedName~SealedEnrollmentGrantTests" --logger trx
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:enrollment-interop
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: console_ci
          POSTGRES_PASSWORD: ci-owner-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d console_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CONSOLE_TEST_DB: Host=127.0.0.1;Port=5432;Database=console_ci;Username=postgres;Password=ci-owner-ephemeral-only
      CONSOLE_TEST_RUNTIME_DB: Host=127.0.0.1;Port=5432;Database=console_ci;Username=console_runtime;Password=ci-runtime-ephemeral-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore ITManagement.slnx --locked-mode
      - run: dotnet build ITManagement.slnx -c Release --no-restore
      - name: Migrate isolated CI database
        env:
          CONSOLE_PROVISIONING_ALLOWED: 'true'
          ConnectionStrings__Console: ${{ env.CONSOLE_TEST_DB }}
        run: dotnet run --project src/Server/Provisioning -c Release --no-build -- migrate
      - name: Provision restricted CI runtime role
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d console_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE console_runtime LOGIN PASSWORD 'ci-runtime-ephemeral-only' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION;"
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d console_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE console_enrollment_plan_locker NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION;"
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d console_ci -v ON_ERROR_STOP=1 -v runtime_role=console_runtime -v enrollment_plan_lock_owner_role=console_enrollment_plan_locker < build/provision-runtime.sql
      - run: dotnet test ITManagement.slnx -c Release --no-build --logger trx
